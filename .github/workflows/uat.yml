name: Deploy to UAT

on:
  pull_request:
    branches:
      - 'uat/**'
    types: [closed]

jobs:
  deploy-hr:
    if: github.event.pull_request.merged == true
    uses: sfc-gh-pfaulkner/snowflake-rbac-framework/.github/workflows/deploy-to-clone.yml@main
    with:
      clone_type: UAT
      environment: PROD
      domain: HR
      db_name: CORE
      dcm_target: PROD
      role: PROD_HR_SYSADMIN
      warehouse: HR_INGEST_WH
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.PROD_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.PROD_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.PROD_PRIVATE_KEY }}

  deploy-brf:
    if: github.event.pull_request.merged == true
    uses: sfc-gh-pfaulkner/snowflake-rbac-framework/.github/workflows/deploy-to-clone.yml@main
    with:
      clone_type: UAT
      environment: PROD
      domain: BRF
      db_name: CORE
      dcm_target: PROD
      role: PROD_BRF_SYSADMIN
      warehouse: BRF_INGEST_WH
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.PROD_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.PROD_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.PROD_PRIVATE_KEY }}

  deploy-general:
    if: github.event.pull_request.merged == true
    uses: sfc-gh-pfaulkner/snowflake-rbac-framework/.github/workflows/deploy-to-clone.yml@main
    with:
      clone_type: UAT
      environment: PROD
      domain: GENERAL
      db_name: CORE
      dcm_target: PROD
      role: PROD_GENERAL_SYSADMIN
      warehouse: GENERAL_TRANSFORM_WH
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.PROD_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.PROD_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.PROD_PRIVATE_KEY }}
