name: Deploy to TEST

on:
  pull_request:
    branches:
      - 'test/**'
    types: [closed]

jobs:
  deploy-hr:
    if: github.event.pull_request.merged == true
    uses: sfc-gh-pfaulkner/snowflake-rbac-framework/.github/workflows/deploy-to-clone.yml@main
    with:
      clone_type: TEST
      environment: DEV
      domain: HR
      db_name: CORE
      dcm_target: DEV
      role: DEV_HR_ETL
      warehouse: HR_DEV_WH
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.DEV_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.DEV_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DEV_PRIVATE_KEY }}

  deploy-brf:
    if: github.event.pull_request.merged == true
    uses: sfc-gh-pfaulkner/snowflake-rbac-framework/.github/workflows/deploy-to-clone.yml@main
    with:
      clone_type: TEST
      environment: DEV
      domain: BRF
      db_name: CORE
      dcm_target: DEV
      role: DEV_BRF_ETL
      warehouse: BRF_DEV_WH
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.DEV_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.DEV_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DEV_PRIVATE_KEY }}

  deploy-general:
    if: github.event.pull_request.merged == true
    uses: sfc-gh-pfaulkner/snowflake-rbac-framework/.github/workflows/deploy-to-clone.yml@main
    with:
      clone_type: TEST
      environment: DEV
      domain: GENERAL
      db_name: CORE
      dcm_target: DEV
      role: DEV_GENERAL_ETL
      warehouse: GENERAL_TRANSFORM_WH
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.DEV_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.DEV_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DEV_PRIVATE_KEY }}
