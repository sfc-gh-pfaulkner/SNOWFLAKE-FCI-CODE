name: Deploy to TEST

on:
  pull_request:
    branches:
      - 'test/**'
    types: [closed]

jobs:
  detect-changes:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    outputs:
      hr: ${{ steps.changes.outputs.hr }}
      brf: ${{ steps.changes.outputs.brf }}
      general: ${{ steps.changes.outputs.general }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "hr=$([[ "$CHANGED" == *domains/hr/* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "brf=$([[ "$CHANGED" == *domains/brf/* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "general=$([[ "$CHANGED" == *domains/general/* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy-hr:
    needs: detect-changes
    if: needs.detect-changes.outputs.hr == 'true'
    uses: sfc-gh-pfaulkner/snowflake-rbac-framework/.github/workflows/deploy-to-clone.yml@main
    with:
      clone_type: TEST
      environment: DEV
      domain: HR
      db_name: CORE
      dcm_target: DEV
      role: DEV_HR_SYSADMIN
      warehouse: HR_DEV_WH
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.DEV_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.DEV_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DEV_PRIVATE_KEY }}

  deploy-brf:
    needs: detect-changes
    if: needs.detect-changes.outputs.brf == 'true'
    uses: sfc-gh-pfaulkner/snowflake-rbac-framework/.github/workflows/deploy-to-clone.yml@main
    with:
      clone_type: TEST
      environment: DEV
      domain: BRF
      db_name: CORE
      dcm_target: DEV
      role: DEV_BRF_SYSADMIN
      warehouse: BRF_DEV_WH
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.DEV_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.DEV_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DEV_PRIVATE_KEY }}

  deploy-general:
    needs: detect-changes
    if: needs.detect-changes.outputs.general == 'true'
    uses: sfc-gh-pfaulkner/snowflake-rbac-framework/.github/workflows/deploy-to-clone.yml@main
    with:
      clone_type: TEST
      environment: DEV
      domain: GENERAL
      db_name: CORE
      dcm_target: DEV
      role: DEV_GENERAL_SYSADMIN
      warehouse: GENERAL_TRANSFORM_WH
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.DEV_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.DEV_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DEV_PRIVATE_KEY }}
